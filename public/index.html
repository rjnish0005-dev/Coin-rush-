<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinRush</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
}
.container{
  max-width:700px;
  margin:auto;
  padding:16px;
}
.card{
  background:#1e293b;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 8px 25px #0003;
}
h1{margin-top:0}
.logo{
  font-size:42px;
}
input,button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}
input{background:#fff;color:#111}
button{
  background:#334155;
  color:#fff;
  cursor:pointer;
}
.primary{background:#2563eb}
.heads{background:#2563eb}
.tails{background:#7c3aed}
.hidden{display:none}
.balance{
  font-size:25px;
  font-weight:bold;
}
.timer{
  text-align:center;
  font-size:55px;
  font-weight:bold;
  margin:10px 0;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#334155;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
.message{
  min-height:25px;
  color:#cbd5e1;
}
.small{
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>
