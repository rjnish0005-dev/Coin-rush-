<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoinRush</title><style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;padding:16px}.box{max-width:720px;margin:auto;background:#1e293b;padding:20px;border-radius:16px;margin-bottom:14px}
input,button{padding:11px;border-radius:9px;border:0;margin:4px}button{cursor:pointer;background:#334155;color:white}.primary{background:#2563eb}
.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#334155;padding:10px;border-radius:10px}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #475569;text-align:left}
</style></head><body>
<div id="login" class="box"><h1>🪙 CoinRush</h1><p>Virtual coins only — fair random results.</p><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button class="primary" onclick="login()">Login</button><p id="lm"></p></div>
<div id="app" class="hidden">
<div class="box"><button onclick="logout()">Logout</button><h1>CoinRush</h1><div class="row"><span class="stat">User: <b id="who"></b></span><span class="stat">Balance: <b id="bal"></b></span></div></div>
<div class="box"><h2>Round <span id="rid">-</span></h2><h1 id="timer">30</h1><div class="row"><input id="amt" type="number" value="100" min="1"><button onclick="bet('HEADS')">HEADS</button><button onclick="bet('TAILS')">TAILS</button></div><p id="msg">Only your own bet is shown.</p></div>
<div class="box"><h3>Public aggregate</h3><div class="row"><span class="stat">Heads: <b id="heads">0</b></span><span class="stat">Tails: <b id="tails">0</b></span><span class="stat">Players: <b id="players">0</b></span></div></div>
<div id="admin" class="box hidden"><h2>Admin Panel</h2><button onclick="loadAdmin()">Refresh</button><div id="adminContent"></div></div>
</div><script src="/socket.io/socket.io.js"></script><script>
let me,end=0;const $=id=>document.getElementById(id);
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
async function login(){try{me=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('lu').value,password:$('lp').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');if(me.role==='admin')$('admin').classList.remove('hidden');refresh()}catch(e){$('lm').textContent=e.message}}
async function refresh(){let m=await api('/api/me');$('who').textContent=m.username;$('bal').textContent=m.balance;let r=await api('/api/round');$('rid').textContent=r.round.id;end=r.round.end_at;let s=await fetch('/api/admin/stats').then(x=>x.ok?x.json():null);if(s){$('heads').textContent=s.heads;$('tails').textContent=s.tails;$('players').textContent=s.players}}
async function bet(side){try{let j=await api('/api/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,amount:+$('amt').value})});$('msg').textContent='Your bet: '+side+' — '+$('amt').value+' coins';refresh()}catch(e){$('msg').textContent=e.message}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
async function loadAdmin(){let u=await api('/api/admin/users'),l=await api('/api/admin/ledger');$('adminContent').innerHTML='<h3>Users</h3><table><tr><th>User</th><th>Balance</th><th>Adjust</th></tr>'+u.map(x=>`<tr><td>${x.username}</td><td>${x.balance}</td><td><input id="a${x.id}" type="number" placeholder="+/-"><button onclick="adjust(${x.id})">Apply</button></td></tr>`).join('')+'</table><h3>Recent Ledger</h3><table><tr><th>User</th><th>Amount</th><th>Type</th></tr>'+l.map(x=>`<tr><td>${x.username}</td><td>${x.amount}</td><td>${x.type}</td></tr>`).join('')+'</table>'}
async function adjust(id){let amount=+$('a'+id).value;if(!amount)return;await api('/api/admin/users/'+id+'/coins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});loadAdmin()}
setInterval(async()=>{if(!me)return;let r=await api('/api/round');end=r.round.end_at;$('rid').textContent=r.round.id;$('timer').textContent=Math.max(0,Math.ceil((end-Date.now())/1000));if(Date.now()>end+500)refresh()},500);
const socket=io();socket.on('public_stats',x=>{$('heads').textContent=x.heads;$('tails').textContent=x.tails;$('players').textContent=x.players});socket.on('round_result',x=>{$('msg').textContent='Round '+x.round+' result: '+x.result;refresh()});
</script></body></html>
